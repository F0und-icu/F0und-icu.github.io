<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Firmware hardware close-up study</title>
  <desc id="desc">A muted editorial hardware diagram with board traces, package outlines, and archival labels.</desc>
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#DBD0C5"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.65"/>
  <g transform="translate(170 110)">
    <rect x="0" y="0" width="1260" height="680" rx="12" fill="#1F1D1B" opacity="0.9"/>
    <rect x="54" y="58" width="1152" height="564" fill="none" stroke="#F7F3F0" stroke-opacity="0.13"/>
    <g stroke="#C39A7A" stroke-width="2" stroke-opacity="0.5" fill="none">
      <path d="M104 156h242v88h226v154h310v130h196"/>
      <path d="M104 458h180v-112h220v-118h344v-74h228"/>
      <path d="M406 548v-148h146v-96h214"/>
      <path d="M822 210v86h166v184"/>
    </g>
    <g fill="#DBD0C5" stroke="#C39A7A" stroke-width="2">
      <rect x="328" y="230" width="274" height="180" rx="4"/>
      <rect x="768" y="306" width="210" height="150" rx="4"/>
      <rect x="104" y="132" width="132" height="78" rx="3"/>
      <rect x="1070" y="490" width="88" height="78" rx="3"/>
    </g>
    <g fill="#F7F3F0" opacity="0.84" font-family="Inter, Helvetica, Arial, sans-serif" letter-spacing="4">
      <text x="346" y="332" font-size="23">BOOT ROM</text>
      <text x="788" y="390" font-size="18">UPDATE DAEMON</text>
      <text x="104" y="664" font-size="19">NAND / TRUST ANCHOR / RECOVERY PATH</text>
    </g>
  </g>
</svg>
