<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protocol parser dossier study</title>
  <desc id="desc">A restrained protocol parser state diagram with warm paper, charcoal blocks, and walnut annotations.</desc>
  <defs>
    <filter id="grain">
